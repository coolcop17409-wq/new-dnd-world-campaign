name: Magic shops — lightweight stock validation

on:
  push:
    paths:
      - "trackers/csv/magic-shops/**"
      - ".github/workflows/magic-shop-check.yml"
  pull_request:
    paths:
      - "trackers/csv/magic-shops/**"
      - "automation/sync_validate.py"
      - ".github/workflows/magic-shop-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current shop records
        uses: actions/checkout@v4
      - name: Validate actual shop owners, lots and event identities
        run: |
          python3 -m py_compile automation/tracker_validate.py
          python3 automation/sync_validate.py --scope shops
      - name: Mark market-only status
        run: echo "No estate ledger, Blackthorn, tax, or dashboard posting was run for this magic-market check."
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-sync-diagnostic
          path: reports/sync-diagnostic.json
          if-no-files-found: warn
          retention-days: 90
