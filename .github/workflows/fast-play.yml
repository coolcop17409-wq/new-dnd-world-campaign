name: Lightweight live-play validation

on:
  push:
    paths:
      - "campaign/continuity/campaign-state.md"
      - "trackers/csv/v/**"
      - "trackers/csv/cirren/**"
      - "trackers/csv/fenar/**"
      - "automation/build_play_packet.py"
      - "automation/test_fast_play.py"
      - ".github/workflows/fast-play.yml"
  workflow_dispatch: # Manual refresh for unchanged-checkpoint journal edits

concurrency:
  group: campaign-generated-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fast-play:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test fast packet generator
        run: |
          python3 -m py_compile automation/build_play_packet.py automation/tracker_validate.py automation/build_dashboard.py
          python3 -m unittest automation/test_fast_play.py -v
      - name: Validate live character and shop trackers
        run: python3 automation/tracker_validate.py
      - name: Generate dashboard overlay and bounded fast packet
        run: |
          test -f reports/estate-ledger.json || { echo "Missing last verified estate ledger report"; exit 1; }
          python3 automation/build_dashboard.py
          python3 automation/build_play_packet.py
      - name: Commit generated fast-play views only if changed
        run: |
          if [ -z "$(git status --porcelain -- reports/tracker-validation.json dashboard/dashboard.json runtime/PLAY_NOW.md)" ]; then
            echo "No generated view changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/tracker-validation.json dashboard/dashboard.json runtime/PLAY_NOW.md
          git commit -m "Refresh fast-play views [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
