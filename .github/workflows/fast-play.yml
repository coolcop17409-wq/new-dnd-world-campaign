name: Lightweight live-play validation

on:
  push:
    paths:
      - "campaign/continuity/campaign-state.md"
      - "trackers/csv/v/**"
      - "trackers/csv/cirren/**"
      - "trackers/csv/fenar/**"
      - "automation/build_play_packet.py"
      - "automation/test_fast_play.py"
      - ".github/workflows/fast-play.yml"
  pull_request:
    paths:
      - "automation/**"
      - ".github/workflows/fast-play.yml"
      - "campaign/continuity/campaign-state.md"
  workflow_dispatch: # Manual refresh for unchanged-checkpoint journal edits

concurrency:
  group: campaign-generated-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fast-play:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test fast packet generator
        run: |
          python3 -m py_compile automation/build_play_packet.py automation/tracker_validate.py automation/build_dashboard.py
          python3 -m unittest automation/test_fast_play.py -v
      - name: Validate final character checkpoint (no estate or shop audit)
        run: |
          python3 automation/sync_validate.py --scope final --phase final
          python3 -c 'import json; from pathlib import Path; Path("reports/tracker-validation.json").write_text(json.dumps({"status":"PASS","scope":"characters","findings":[]})+"\n")' 
      - name: Generate dashboard overlay and bounded fast packet
        run: |
          test -f reports/estate-ledger.json || { echo "Missing last verified estate ledger report"; exit 1; }
          python3 automation/build_dashboard.py
          python3 automation/build_play_packet.py
      - name: Publish generated views at unchanged source head
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python3 automation/publish_generated.py reports/tracker-validation.json dashboard/dashboard.json runtime/PLAY_NOW.md
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-sync-diagnostic
          path: reports/sync-diagnostic.json
          if-no-files-found: warn
          retention-days: 90
