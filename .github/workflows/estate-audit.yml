name: Estate audit and staging dashboard

on:
  push:
    paths:
      - "trackers/csv/property/**"
      - "trackers/csv/v/**"
      - "trackers/csv/cirren/**"
      - "trackers/csv/fenar/**"
      - "trackers/csv/magic-shops/**"
      - "trackers/index.json"
      - "campaign/continuity/campaign-state.md"
      - "data/estate/**"
      - "automation/estate_audit.py"
      - "automation/estate_ledger.py"
      - "automation/blackthorn_rules.py"
      - "automation/blackthorn_operations.py"
      - "automation/routine_accruals.py"
      - "trackers/csv/property/blackthorn-operations.csv"
      - "trackers/csv/property/blackthorn-rates-staff.csv"
      - "trackers/csv/property/blackthorn-orders.csv"
      - "trackers/csv/property/blackthorn-schedule.csv"
      - "trackers/csv/property/blackthorn-opening-balances.csv"
      - "data/estate/blackthorn-rates.csv"
      - "automation/build_dashboard.py"
      - "automation/tracker_validate.py"
      - "automation/test_estate_ledger.py"
      - "data/characters/**"
      - ".github/workflows/estate-audit.yml"
  workflow_dispatch:
    inputs:
      campaign_day:
        description: "Current in-game campaign day (optional; adds due-task review)"
        required: false
        type: string
      closed_through_day:
        description: "Last fully closed campaign day (optional; previews actual Blackthorn routine accruals)"
        required: false
        type: string
      post_closed_day_accruals:
        description: "Post calculated accruals to the staging ledger; requires closed_through_day"
        required: false
        type: boolean
        default: false

concurrency:
  group: estate-audit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: python3 -m py_compile automation/estate_audit.py automation/estate_ledger.py automation/blackthorn_rules.py automation/blackthorn_operations.py automation/routine_accruals.py automation/build_dashboard.py automation/tracker_validate.py automation/test_estate_ledger.py

      - name: Exercise ledger edge cases
        run: python3 -m unittest automation/test_estate_ledger.py -v

      - name: Generate estate checks and dashboard data
        id: generate
        continue-on-error: true
        env:
          CAMPAIGN_DAY: ${{ inputs.campaign_day }}
          CLOSED_THROUGH_DAY: ${{ inputs.closed_through_day }}
          POST_CLOSED_DAY_ACCRUALS: ${{ inputs.post_closed_day_accruals }}
        run: |
          set +e
          python3 automation/blackthorn_operations.py
          blackthorn_operations_status=$?
          if [ "$POST_CLOSED_DAY_ACCRUALS" = "true" ]; then
            if [ -z "$CLOSED_THROUGH_DAY" ]; then
              echo "Posting requires an explicit closed_through_day."
              routine_accrual_status=1
            else
              python3 automation/routine_accruals.py --closed-through-day "$CLOSED_THROUGH_DAY" --apply
              routine_accrual_status=$?
            fi
          elif [ -n "$CLOSED_THROUGH_DAY" ]; then
            python3 automation/routine_accruals.py --closed-through-day "$CLOSED_THROUGH_DAY"
            routine_accrual_status=$?
          else
            python3 automation/routine_accruals.py
            routine_accrual_status=$?
          fi
          routine_accrual_status=$?
          python3 automation/estate_audit.py
          audit_status=$?
          python3 automation/estate_ledger.py
          ledger_status=$?
          python3 automation/tracker_validate.py
          tracker_status=$?
          if [ -f reports/estate-ledger.json ]; then
            python3 automation/build_dashboard.py
            dashboard_status=$?
          else
            echo "Estate ledger report missing; dashboard not generated."
            dashboard_status=1
          fi
          echo "blackthorn_operations_status=$blackthorn_operations_status" >> "$GITHUB_OUTPUT"
          echo "routine_accrual_status=$routine_accrual_status" >> "$GITHUB_OUTPUT"
          echo "audit_status=$audit_status" >> "$GITHUB_OUTPUT"
          echo "ledger_status=$ledger_status" >> "$GITHUB_OUTPUT"
          echo "tracker_status=$tracker_status" >> "$GITHUB_OUTPUT"
          echo "dashboard_status=$dashboard_status" >> "$GITHUB_OUTPUT"
          if [ "$blackthorn_operations_status" -ne 0 ] || [ "$routine_accrual_status" -ne 0 ] || [ "$audit_status" -ne 0 ] || [ "$ledger_status" -ne 0 ] || [ "$tracker_status" -ne 0 ] || [ "$dashboard_status" -ne 0 ]; then
            exit 1
          fi

      - name: Commit generated staging reports
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- reports/estate-review.md reports/estate-ledger.json reports/blackthorn-operations.json reports/routine-accrual-preview.json reports/tracker-validation.json dashboard/dashboard.json data/estate/events.csv data/estate/routine-accrual-meta.json)" ]; then
            echo "Staging reports have no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/estate-review.md reports/estate-ledger.json reports/blackthorn-operations.json reports/routine-accrual-preview.json reports/tracker-validation.json dashboard/dashboard.json data/estate/events.csv data/estate/routine-accrual-meta.json
          git commit -m "Refresh staging tracker reports [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Mark validation findings as workflow failure
        if: steps.generate.outcome == 'failure'
        run: exit 1
