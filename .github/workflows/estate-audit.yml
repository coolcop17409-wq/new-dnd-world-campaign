name: Estate audit

on:
  push:
    paths:
      - "trackers/csv/property/**"
      - "trackers/index.json"
      - "automation/estate_audit.py"
      - ".github/workflows/estate-audit.yml"
  workflow_dispatch:
    inputs:
      campaign_day:
        description: "Current in-game campaign day (optional; adds due-task review)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate estate audit
        id: estate_audit
        continue-on-error: true
        env:
          CAMPAIGN_DAY: ${{ inputs.campaign_day }}
        run: python3 automation/estate_audit.py

      - name: Commit updated review
        if: always()
        run: |
          if git diff --quiet -- reports/estate-review.md; then
            echo "Estate review has no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/estate-review.md
          git commit -m "Update estate audit report [skip ci]"
          git push

      - name: Mark audit findings as workflow failure
        if: steps.estate_audit.outcome == 'failure'
        run: exit 1
