name: Handoff queue integrity (not a background ChatGPT worker)

on:
  push:
    paths:
      - "automation/handoffs/**"
      - ".github/workflows/handoff-validate.yml"
  pull_request:
    paths:
      - "automation/handoffs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-handoff-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requests and receipts
        uses: actions/checkout@v4
      - name: Validate handoff file format without performing gameplay
        run: |
          python3 -m unittest automation.handoffs.test_validate -v
          python3 automation/sync_validate.py --scope handoffs
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-sync-diagnostic
          path: reports/sync-diagnostic.json
          if-no-files-found: warn
          retention-days: 90
