name: Campaign synchronization regression
on:
  push:
    paths:
      - 'automation/sync*.py'
      - 'automation/handoffs/sync-repair/**'
      - 'automation/test_sync_repair.py'
      - '.github/workflows/sync*.yml'
  pull_request:
    paths:
      - 'automation/sync*.py'
      - 'automation/handoffs/**'
      - 'automation/test_sync_repair.py'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test synthetic transactions, deduplication and concurrent writes
        run: python3 -m unittest automation.test_sync_repair automation.test_fast_play automation.handoffs.test_validate -v
      - name: Validate optional isolated integration fixture
        run: python3 automation/handoffs/sync-repair/check_fixture.py
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-sync-diagnostic
          path: reports/sync-diagnostic.json
          if-no-files-found: warn
          retention-days: 90
